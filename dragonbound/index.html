<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dragonbound (Beta)</title>
<meta name="description" content="RPG de ação e exploração em pixel art: encontre, compreenda e conquiste a confiança de dragões únicos em um arquipélago vivo.">
<meta name="theme-color" content="#0c0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dragonbound">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0c0e1a; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #f4f0e6; }
  #game { position: absolute; inset: 0; }
  #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #safe-probe { position: fixed; inset: 0; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #boot { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; letter-spacing: .3em; background: radial-gradient(circle at 50% 60%, #1d2238, #0c0e1a 70%); }
  #boot small { display: block; letter-spacing: .1em; opacity: .6; margin-top: .8em; }
  #rotate { display: none; position: fixed; left: 0; right: 0; bottom: 0; padding: .6em 1em calc(.6em + env(safe-area-inset-bottom)); background: #b8552e; text-align: center; z-index: 5; }
  @media (orientation: portrait) and (max-width: 700px) { #rotate { display: block; } }
  #update { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 6; padding: .5em 1em; border: 2px solid #f2c14e; background: #1d2238; color: #f4f0e6; font: inherit; }
</style>
</head>
<body>
<div id="game"></div>
<div id="safe-probe"></div>
<div id="boot"><div>DRAGONBOUND<small>versão beta · carregando…</small></div></div>
<div id="rotate">Gire o aparelho: Dragonbound foi feito para a horizontal.</div>
<button id="update" hidden>Nova versão disponível — toque para atualizar</button>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
